{% extends 'layout/base.html' %}

{% block title %}D3 Item Salvager{% endblock %}

{% block extra_head %}
<link rel="icon"
    href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR4nGNgYAAAAAMAASsJTYQAAAAASUVORK5CYII=">
{% endblock %}

{% block body %}
<div class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto space-y-6">
        <!-- Header -->
        <div class="navbar bg-base-100 rounded-box shadow-lg">
            <div class="flex-1">
                <a class="btn btn-ghost text-xl">D3 Item Salvager</a>
            </div>
            <div class="flex-none">
                <button class="btn btn-square btn-ghost">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                        class="inline-block w-5 h-5 stroke-current">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M5 12h.01M12 12h.01M19 12h.01M6 12a1 1 0 11-2 0 1 1 0 012 0 1 1 0 012 0 1 1 0 012-2zm7 0a1 1 0 11-2 0 1 1 0 012 0 1 1 0 012 0 1 1 0 012-2zm7 0a1 1 0 11-2 0 1 1 0 012 0 1 1 0 012 0 1 1 0 012-2z">
                        </path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Selection Card -->
        <div class="card bg-base-100 shadow-xl">
            <div class="card-body">
                <h2 class="card-title mb-4">Select Builds</h2>

                <form hx-post="/hx/items" hx-target="#results-area" hx-indicator="#loading">
                    <div class="form-control w-full">
                        <label class="label">
                            <span class="label-text">Select one or more Build Guides</span>
                        </label>
                        <select id="build-select" name="build_ids" multiple placeholder="Select builds..."
                            autocomplete="off">
                            <option value="">Select builds...</option>
                            {% for cls in sorted_classes %}
                            <optgroup label="{{ cls }}">
                                {% for build in builds_by_class[cls] %}
                                <option value="{{ build.id }}">{{ build.title }}</option>
                                {% endfor %}
                            </optgroup>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="card-actions justify-end mt-4">
                        <button class="btn btn-primary" type="submit">
                            Apply Selection
                            <span id="loading" class="loading loading-spinner loading-sm htmx-indicator pl-2"></span>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Results Area -->
        <div id="results-area">
            <!-- Items table will be loaded here -->
            <div class="alert">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                    class="stroke-info shrink-0 w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span>Select builds and click Apply to see the salvage table.</span>
            </div>

            <!-- Container used by client-side renderer (item_list.js) -->
            <div id="item-summary-content"></div>
        </div>
    </div>

    {% block extra_scripts %}
    <script>
        // Init Alpine Data
        document.addEventListener('alpine:init', () => {
            // Load global game data for tooltips/reference
            Alpine.store('gameData', {
                data: null,
                init() {
                    fetch('/static/data.json')
                        .then(r => r.json())
                        .then(json => this.data = json)
                        .catch(e => console.error('Failed to load game data', e));
                }
            });

            Alpine.data('itemTable', (initialItems) => ({
                items: initialItems,
                filteredItems: initialItems,
                search: '',
                fuse: null,

                _enrichItem(item) {
                    if (!item) return item;
                    // If quality already set, ensure d3planner class is present
                    if (item.quality) {
                        const q = String(item.quality).toLowerCase().replace(/\s+/g, '-');
                        let prefix = '';
                        if (q === 'ethereal') prefix = 'd3planner-eth ';
                        if (q === 'sanctified') prefix = 'd3planner-sanctified ';
                        item.d3planner_class = prefix + 'item-' + q;
                        return item;
                    }

                    // Try to find in the game data lookups
                    let found = null;
                    if (this._gameItemsById && item.item_id) {
                        found = this._gameItemsById.get(item.item_id);
                    }
                    if (!found && this._gameItemsByName && item.name) {
                        found = this._gameItemsByName.get(item.name.toLowerCase());
                    }

                    if (found) {
                        if (!item.quality && found.quality) item.quality = found.quality;
                        if (!item.type && found.type) item.type = found.type;
                    }

                    const q = item.quality ? String(item.quality).toLowerCase().replace(/\s+/g, '-') : '';
                    let prefix = '';
                    if (q === 'ethereal') prefix = 'd3planner-eth ';
                    if (q === 'sanctified') prefix = 'd3planner-sanctified ';
                    item.d3planner_class = q ? (prefix + 'item-' + q) : '';
                    return item;
                },

                init() {
                    // Initialize Fuse.js for local (build) items
                    const options = {
                        keys: ['name', 'slot'],
                        threshold: 0.3,
                        includeScore: true,
                        minMatchCharLength: 1,
                        distance: 100
                    };
                    this.fuse = new Fuse(this.items, options);

                    // Prepare a lightweight gameData index when available (names only)
                    const setupGameIndex = () => {
                        const gd = Alpine.store('gameData') && Alpine.store('gameData').data;
                        if (!gd || !gd.items) return;

                        // Build an array of catalog items with minimal needed fields
                        this._gameItems = Object.values(gd.items)
                            .filter(i => i && i.name)
                            .map(i => ({ id: i.id || i.name, name: i.name, type: i.type || '', quality: i.quality || '' }));

                        // Build fast lookup maps for enrichment
                        this._gameItemsById = new Map();
                        this._gameItemsByName = new Map();
                        for (const gi of this._gameItems) {
                            if (gi.id) this._gameItemsById.set(gi.id, gi);
                            if (gi.name) this._gameItemsByName.set((gi.name || '').toLowerCase(), gi);
                        }

                        const gameOptions = {
                            keys: ['name'],
                            threshold: 0.3,
                            includeScore: true,
                            minMatchCharLength: 1,
                            distance: 100
                        };
                        this.gameDataFuse = new Fuse(this._gameItems, gameOptions);

                        // Enrich any already-loaded items (build items may lack quality)
                        this.items = this.items.map(it => { this._enrichItem(it); return it; });

                        // Rebuild search index and refresh results
                        if (this.fuse) this.fuse.setCollection(this.items);
                        this.updateResults();
                    };

                    // If game data not yet loaded, poll briefly until available
                    if (!Alpine.store('gameData') || !Alpine.store('gameData').data) {
                        const interval = setInterval(() => {
                            if (Alpine.store('gameData') && Alpine.store('gameData').data) {
                                setupGameIndex();
                                clearInterval(interval);
                            }
                        }, 100);
                    } else {
                        setupGameIndex();
                    }

                    // Watch for local items updates
                    this.$watch('items', (val) => {
                        this.fuse.setCollection(val);
                        this.updateResults();
                    });
                },

                updateResults() {
                    const q = (this.search || '').trim();

                    // No query => show original build items
                    if (!q) {
                        this.filteredItems = this.items;
                        return;
                    }

                    // Get local build item matches
                    const localMatches = this.fuse.search(q, { limit: 100 }).map(r => ({ item: r.item, score: r.score ?? 0, salvage: false }));

                    // Get game DB matches (as Salvage candidates)
                    let gameMatches = [];
                    if (this.gameDataFuse) {
                        gameMatches = this.gameDataFuse.search(q, { limit: 100 }).map(r => ({ item: r.item, score: r.score ?? 0, salvage: true }));
                    }

                    // Dedupe: prefer build items when name matches
                    const seen = new Map(); // key -> {item,score,salvage}

                    const normalizeName = (name) => (name || '').toLowerCase().trim();

                    // Add local matches first
                    for (const m of localMatches) {
                        const key = normalizeName(m.item.name) || m.item.item_id || m.item.id;
                        seen.set(key, { item: m.item, score: m.score, salvage: false });
                    }

                    // Add game matches only if not present in local
                    for (const m of gameMatches) {
                        const key = normalizeName(m.item.name) || m.item.id;
                        if (seen.has(key)) continue;

                        // Build a minimal row shape compatible with the table
                        const row = {
                            item_id: m.item.id || m.item.name,
                            name: m.item.name,
                            slot: m.item.type || '',
                            quality: m.item.quality || '',
                            usage_contexts: m.item.usage_contexts || [],
                            variant_ids: m.item.variant_ids || [],
                            classification: 'Salvage',
                            badge_class: 'badge badge-sm badge-warning'
                        };

                        seen.set(key, { item: row, score: m.score, salvage: true });
                    }

                    // Convert to array and sort by score then name
                    const combined = Array.from(seen.values()).map(v => v);
                    combined.sort((a, b) => {
                        if (a.score !== b.score) return (a.score ?? 1) - (b.score ?? 1);
                        const an = (a.item.name || '').toLowerCase();
                        const bn = (b.item.name || '').toLowerCase();
                        return an < bn ? -1 : an > bn ? 1 : 0;
                    });

                    // Map into filteredItems with expected fields and enrich missing metadata
                    this.filteredItems = combined.map(v => {
                        // Clone to avoid mutating original source objects
                        let it = Object.assign({}, v.item);

                        if (v.salvage) {
                            it = Object.assign(it, { classification: it.classification || 'Salvage', badge_class: it.badge_class || 'badge badge-sm badge-warning' });
                        }

                        // Enrich quality/type and compute d3planner class when possible
                        this._enrichItem(it);

                        return it;
                    });
                }
            }));
        });

        // Init Tom Select (guard against redeclaration during hot reloads)
        if (typeof window.buildSelect === 'undefined') {
            window.buildSelect = new TomSelect("#build-select", {
                plugins: ['remove_button', 'checkbox_options', 'clear_button'],
                maxOptions: null,
                create: false,
                sortField: {
                    field: "text",
                    direction: "asc"
                }
            });
        }
    </script>
    {% endblock %}
</div>
{% endblock %}
